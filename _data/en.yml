privacy:
  title: Privacy policy | Get informed and protect your data — Blabla Korea
  b00_1: Privacy policy
  b00_2: "Last updated: July 2026"
  b00_3: About Us
  b00_4: " Blabla Korea a France-Korea facilitation service provided by Jeanne
    Lethielleux and Jonghyuk Lee. If you have any questions regarding your
    personal data, please contact us at: contact.blablakorea@gmail.com"
  b00_5: What data do we collect?
  b00_6: " We only collect the data you voluntarily provide us through our contact
    form: first name, last name, email address, and the content of your message.
    We do not collect any browsing data, do not use analytical cookies, and do
    not use any tracking tools."
  b00_7: Why do we use this data?
  b00_8: " Your data is used exclusively to respond to your request and to discuss
    your project with you. It is never shared with third parties, resold, or
    used for commercial purposes."
  b00_9: How long do we keep your data?
  b00_10: " Your data is kept for the time necessary to process your request, and
    for a maximum of 3 years from our last exchange."
  b00_11: Your rights
  b00_12: " In accordance with the General Data Protection Regulation (GDPR), you
    have the following rights regarding your data: access, rectification,
    erasure, objection, and portability. To exercise these rights, please
    contact us at: [your email de contact]"
  b00_13: Website hosting
