  b07_1: Jeanne Lethielleux
  b08_1: Founder - Expert in project management and communication
  b08_2: "I am the one who keeps things on track. Organizing, prioritizing, and
    anticipating are what I've been doing for several years on international
    projects in France and abroad. "
  b08_3: At Blabla Korea, I provide structure. From the initial contact to the
    successful completion of your project, I ensure that every step moves
    forward. Curious and attentive, I am convinced that the best opportunities
    are found when we are willing to think outside the box.
  b10_photo: /assets/images/8d08d914be6275.jpg
  b10_alt: A smiling person sitting on a bench along the Seine in Paris, with a
    French flag in the background, and bridges, boats, and historic buildings
    visible in the scene.
  b11_1: Founder - Korea and business expert
  b11_2: "I am the one who reaches out to others.  "
  b11_3: At Blabla Korea, I am the one who connects. I know where to look, who to
    contact, and how to phrase things so that both sides truly understand each
    other. Curious and determined, I believe that the best relationships are
    born from authentic exchanges, without filters or detours.
  b12_1: Jonghyuk Lee
  b13_photo: /assets/images/d7690b7f64b3f7.jpg
  b13_alt: A modern interior featuring a bust sculpture next to a brown leather
    armchair, a plant with yellow flowers, white shopping bags, an air purifier,
