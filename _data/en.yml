about:
  title: About us | Blabla Korea, the French-Korean duo — Blabla Korea
  b00_1: Your gateway to Korea
  b01_1: A French-Korean duo
  b01_2: "Blabla Korea, it is "
  b01_3: a combination of two perspectives
  b01_4: " on professional relations between France and South Korea."
  b01_5: Jonghyuk
  b01_6: ", a native of Daegu, has first-hand knowledge of Korean business
    practices: who to contact, what tools to use, and what might go wrong when
    approaching someone."
  b01_7: Jeanne
  b01_8: " has five years of experience in international communications and
    promotion, including the organization of trade shows and events. She
    structures each project and ensures that every step remains clear and
    achievable."
  b01_9: "Together, we serve as your "
  b01_10: bridge between France and Korea
  b01_11: " : whether you’re a French company looking for Korean partners or a
    Korean company looking to expand into France."
  b02_photo: /assets/images/52a6b6a56b7037.jpg
  b02_alt: A smiling young man is looking to the right, standing on a rooftop with
    a cityscape in the background at sunset.
