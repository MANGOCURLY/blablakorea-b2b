  b14_alt: A woman with short hair, wearing a black coat, standing near a river or
    a port, with a building and statues in the background.
  b15_1: The people without whom this project would not be possible…
  b16_1: "Photographer "
  b16_2: Because this project was meant to reflect us, there was no one better to
    illustrate it than Léo, who has been with us every step of the way.
  b17_1: Léo Lethielleux
  b18_1: "\n    View her portfolio\n  "
  b19_photo: /assets/images/df6b29e8ccaba1.jpg
  b19_alt: A young woman with long brown hair, wearing a black top with pink
    accents, looks over her shoulder with a slight smile.
  b20_photo: /assets/images/1b6f6d02524265.jpg
  b20_alt: A modern hair salon with brown makeup chairs and round mirrors with LED
    lighting in a white and gray interior.
  b21_1: K-Beauty and Fashion Ambassador
  b21_2: "Since this project is best experienced from Korea, we needed someone on
    the ground. Based in Daegu, where she runs her boutique, "
  b21_3: The Perfume Avenue
  b21_4: ", Hyanggi is our field reporter. She keeps us updated on social media
    and shares her beauty and fashion tips, her favorite finds, and the latest
    trends : all to bring you a firsthand look at Korea."
  b21_5: A multiple gold medalist in international beauty pageants and winner of
    the City of Daegu Artistic Award, she brings an expert eye and a strong
    local presence to Blabla Korea .
  b22_1: Hyanggi Lee
  b23_1: About our project
  b24_1: "We have each lived in the other's country. Jonghyuk in France, Jeanne in
    Korea. Over the years, we both experienced the same reality firsthand:
    language can be a barrier, but culture can be even more isolating. Not
    knowing who to contact, how to phrase a request, what tools to use, or which
    customs to respect: these are some of the difficulties that lead some people
    to abandon their projects."
  b24_2: "It was from this shared experience that Blabla Korea was born. We
    position ourselves as a resource at your side, no matter what kind of
    project you’re undertaking with Korea. "
  b24_3: "Our strength? An in-depth knowledge of both cultures and a "
  b24_4: "complementary skill set "
  b24_5: that allows us to cover together what neither of us could do alone.
  b24_6: Our motto is
  b24_7: exchange
  b24_8: ". Above all, we take the time to understand your project and truly
    listen to you. Because effective support starts with a "
  b24_9: "conversation "
  b24_10: ", and every project deserves a "
  b24_11: tailored solution.
