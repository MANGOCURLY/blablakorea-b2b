service:
  title: "Accompagnement B2B Corée du Sud : préparation et visites d'affaires — Blabla Korea"
  b00_1: "Quand deux mondes professionnels ne se parlent pas naturellement"
  b01_1: "La France et la Corée du Sud entretiennent des relations économiques et culturelles anciennes, mais ce sont deux mondes professionnels qui fonctionnent selon des logiques profondément différentes."
  b02_photo: "/assets/images/9279ebc6242864.jpg"
  b02_alt: "Un château historique avec un toit en ardoise et une tour centrale, entouré de verdure et de maisons anciennes, sous un ciel bleu avec quelques nuages."
  b03_photo: "/assets/images/a69c0e2fa05bd5.jpg"
  b03_alt: "Vue d'une rivière avec des végétations en premier plan, un groupe d'immeubles en arrière-plan, et des montagnes au fond sous un ciel clair."
  b04_photo: "/assets/images/b514d03c583279.jpg"
  b04_alt: "Une grande roue de fête foraine vue depuis en dessous, avec des personnes marchant ou se tenant sur une passerelle en haut. Le ciel est bleu clair et il y a des arbres en bas."
  b05_1: "Comment ça se passe ?"
  b06_1: "Un pont tient parce qu'il a deux rives. "
  b06_2: "C'est la combinaison de "
  b06_3: "nos deux regards"
  b06_4: " qui nous permet de vous faire traverser ce pont dans les deux sens"
  b07_1: "01"
  b07_2: "Échanger"
  b07_3: "Un appel de 30 minutes, offert. "
  b07_4: "Vous nous racontez votre projet, nous vous disons honnêtement si nous pouvons vous aider"
  b08_1: "02"
  b08_2: "Une proposition sur mesure"
  b08_3: "Vous recevez une proposition écrite et chiffrée : objectifs, étapes, calendrier et budget, construits pour votre projet, sans formule toute faite."
  b09_1: "03"
  b09_2: "Préparer et accompagner"
  b09_3: "Nous formons vos équipes aux codes des affaires, prise de rendez-vous. Nous sommes également présents à vos côtés pour vos éventuels déplacements ou évènements."
  b10_1: "04"
  b10_2: "Un suivi après la rencontre"
  b10_3: "Relances, comptes rendus, prochains rendez-vous : en Corée, la relation se construit surtout après la première rencontre."
  b11_1: "\n    Contactez nous\n  "
  b12_1: "Ils nous ont fait confiance "
  b13_1: "Depuis deux ans, nous accompagnons des institutions et entrepreneurs coréens dans leurs projets en France. Ces premières missions réussies nous ont convaincus de proposer ce service dans l'autre sens : accompagner les entreprises françaises vers la Corée du Sud."
  b14_photo: "/assets/images/4bc548d214922c.jpg"
  b14_alt: "Groupe de personnes tenant une banderole lors d'une sortie en plein air, avec des moutons en arrière-plan, en France ou en Angleterre, par une journée ensoleillée."
  b15_photo: "/assets/images/a3dbe1ca3a70ec.jpg"
  b15_alt: "Groupe de personnes en train d'écouter une femme qui parle lors d'une visite guidée dans un espace intérieur avec des murs en bois et des étagères."
  b16_1: "Marque coréenne de lunetterie - Salon SILMO Paris, septembre 2026"
  b16_2: "Présence aux côtés d'une marque coréenne de lunetterie pendant les trois jours du salon : présentation de la gamme aux visiteurs, identification des prospects sérieux et préparation des rencontres avec la dirigeante, pour qu'elle consacre son temps aux échanges qui comptent."
  b17_photo: "/assets/images/9164a37452e189.jpg"
  b17_alt: ""
  b18_1: "Délégation institutionnelle - Région d'Andong (Corée du Sud), avril 2025"
  b18_2: "Organisation complète d'une visite d'étude thématique en France pour une délégation : conception du programme, réservation et coordination des prestataires français, interprétariat français-coréen pendant toute la durée du séjour."
  b19_photo: "/assets/images/5488aa37124393.jpg"
  b19_alt: "Une salle d'exposition avec des lunettes de soleil sur un comptoir en premier plan, deux hommes discutant en arrière-plan, un environnement moderne avec d'autres personnes et des stands d'exposition."
  b20_photo: "/assets/images/f2d431a023cd00.jpg"
  b20_alt: ""
  b21_photo: "/assets/images/2bfda47d25cec2.jpg"
  b21_alt: "Groupe de personnes discutant autour d'un stand de vente de lunettes dans un centre d'exposition ou un salon. Plusieurs lunettes sont exposées sur le comptoir et deux hommes, dont l'un porte des lunettes, sont engagés dans une conversation."
  b22_1: "Entreprises agroalimentaires coréennes - Salon SIAL Paris, octobre 2026"
  b22_2: "Interprétariat pendant les cinq jours du salon pour une coopérative agroalimentaire coréenne : accompagnement de ses échanges avec les visiteurs et les acheteurs européens, en coréen, en français et en anglais."
  b23_1: "\n    Suivre nos actualités sur LinkedIn\n  "
  b24_1: "La préparation de votre projet"
  b25_1: "Tout projet commence par un premier échange, offert et sans engagement. Ensemble, nous répondons aux questions qui le structurent :"
  b25_2: "Quel est mon projet, et qu'est-ce qu'une réussite concrète pour moi ?"
  b25_3: "Quels sont mes délais et sont-ils réalistes côté coréen ?"
  b25_4: "Qui sont les bons interlocuteurs à contacter, et dans quel ordre ?"
  b25_5: "Mon équipe est-elle prête culturellement pour un premier échange?"
  b25_6: "C'est l'étape la plus importante : elle nous permet de comprendre réellement vos ambitions et de vous proposer l'accompagnement le plus adapté."
  b26_1: "Contactez-nous pour discuter de votre projet "
  b26_2: "Vous pouvez remplir le formulaire ci-dessous ou nous envoyer un mail à "
  b26_3: "contact@blablakorea.com"
  b26_4: "(1er échange offert) "
  b28_1: "Pourquoi notre duo fait la différence? "
  b29_1: "Un consultant interculturel vous parlera de codes. Une agence de traduction vous parlera de mots. "
  b29_2: "Nous, on vous parle des deux en même temps, parce que nous sommes deux à porter cette expertise."
  b30_1: "Jonghyuk identifie les interlocuteurs coréens, sait quels outils sont réellement utilisés là-bas (souvent très différents des standards occidentaux) et repère immédiatement ce qui, dans une approche, risque de mal passer culturellement. "
  b30_2: "Jeanne structure le projet, traduit les enjeux business dans les deux sens, et s'assure que chaque étape reste claire, cadrée et réalisable."
  b30_3: "Mais avant tout, nous "
  b30_4: "continuons d’apprendre"
  b30_5: ". Nous allons régulièrement à la rencontre de celles et ceux qui font vivre les liens entre la France et la Corée depuis des années : entrepreneurs, institutions, acteurs de terrain. En 2026, nous avons ainsi participé au K-Founders Connect in Paris et au colloque des 140 ans des relations franco-coréennes, à l’Assemblée nationale. Chaque échange avec des personnes plus expérimentées enrichit l’accompagnement que nous vous proposons."
  b31_photo: "/assets/images/7ff5d0b751c675.jpg"
  b31_alt: "Groupe de personnes posant pour une photo lors d'une conférence, avec un panneau en arrière-plan indiquant '2026 K-Founders Connect in Paris'."
  b32_photo: "/assets/images/2b3285a414b0a0.jpg"
  b32_alt: "Deux hommes en costume posent ensemble lors d'un événement. Ils sont au centre de la photo, dans une salle ornée de bois, avec d'autres personnes en arrière-plan travaillant ou parlant."
  b33_photo: "/assets/images/f8fc4da482939d.jpg"
  b33_alt: ""
  b34_photo: "/assets/images/f959cd29212fcb.webp"
  b34_alt: "Jonghyuk et la présidente de Kimchi Château posent pour une photo lors d'une conférence à Paris. Elles font un geste de cœur avec leur main, et la femme porte un manteau à carreaux. Le jeune homme porte une chemise blanche et un badge autour du cou."
  b35_photo: "/assets/images/1bca314fdf0fe1.jpg"
  b35_alt: ""
  b36_1: "Le constat qui a tout déclenché"
  b36_2: "Jonghyuk le voit depuis toujours, sans même y penser au départ : en Corée, on ne cherche pas une information de la même façon, on ne contacte pas un partenaire de la même façon, on n’utilise pas les mêmes outils. Naver plutôt que Google, KakaoTalk plutôt qu’un email, une hiérarchie de contact qui n’a rien à voir avec les usages français. Ce qui semble évident pour lui ne l’est pour personne ici."
  b36_3: "Jeanne, elle, l’a appris à ses dépens. Quatre ans à l’étranger, dont deux ans en Corée du Sud, et la certitude qu’on peut être rigoureux, bien préparé, parfaitement intentionné et tout de même se heurter à un mur."
  b36_4: "C’est ce double constat qui nous a poussés à construire ce "
  b36_5: "pont"
  b36_6: " nous-mêmes : pas pour vendre une méthode toute faite, mais pour éviter à d’autres les détours et les malentendus auxquels nous avons nous-mêmes dû faire face."
