privacy:
  title: "Politique de confidentialité | Informez-vous et protégez vos données — Blabla Korea"
  b00_1: "Politique de confidentialité"
  b00_2: "Dernière mise à jour : juillet 2026"
  b00_3: "Qui sommes-nous ?"
  b00_4: " Blabla Korea est un service de facilitation France-Corée proposé par Jeanne Lethielleux et Jonghyuk Lee. Pour toute question relative à vos données personnelles, vous pouvez nous contacter à : contact.blablakorea@gmail.com"
  b00_5: "Quelles données collectons-nous ?"
  b00_6: " Nous collectons uniquement les données que vous nous transmettez volontairement via notre formulaire de contact : prénom, nom, adresse email et le contenu de votre message. Nous ne collectons aucune donnée de navigation, n'utilisons pas de cookies analytiques et ne recourons à aucun outil de tracking."
  b00_7: "Pourquoi utilisons-nous ces données ?"
  b00_8: " Vos données sont utilisées exclusivement pour répondre à votre demande et échanger avec vous sur votre projet. Elles ne sont jamais transmises à des tiers, revendues ou utilisées à des fins commerciales."
  b00_9: "Combien de temps conservons-nous vos données ?"
  b00_10: " Vos données sont conservées le temps nécessaire au traitement de votre demande, et au maximum 3 ans à compter de notre dernier échange."
  b00_11: "Vos droits"
  b00_12: " Conformément au Règlement Général sur la Protection des Données (RGPD), vous disposez des droits suivants sur vos données : accès, rectification, suppression, opposition et portabilité. Pour exercer ces droits, contactez-nous à : [votre email de contact]"
  b00_13: "Hébergement du site"
  b00_14: " Ce site est hébergé par GitHub Pages (GitHub, Inc.). Pour en savoir plus : "
  b00_15: "Déclaration de confidentialité de GitHub"
about:
  title: "Qui sommes-nous ? | Blabla Korea, le duo franco-coréen — Blabla Korea"
  b00_1: "Votre porte d'entrée vers la Corée"
  b01_1: "Un duo franco-coréen"
  b01_2: "Blabla Korea, c’est "
  b01_3: "l’association de deux regards"
  b01_4: " sur les relations professionnelles entre la France et la Corée du Sud."
  b01_5: "Jonghyuk"
  b01_6: ", originaire de Daegu, connaît de l’intérieur les usages professionnels coréens : qui contacter, avec quels outils, et ce qui risque de mal passer dans une approche."
  b01_7: "Jeanne"
  b01_8: " a cinq ans d’expérience en communication et promotion internationale, dont l’organisation de salons et d’événements. Elle structure chaque projet et veille à ce que chaque étape reste claire et réalisable."
  b01_9: "Ensemble, nous agissons comme votre "
  b01_10: "pont entre la France et la Corée"
  b01_11: " : que vous soyez une entreprise française à la recherche d’interlocuteurs coréens, ou une entreprise coréenne qui souhaite se lancer en France."
  b02_photo: "/assets/images/52a6b6a56b7037.jpg"
  b02_alt: "Un jeune homme souriant regarde vers la droite, debout sur un toit avec une vue urbaine en arrière-plan au coucher du soleil."
  b03_photo: "/assets/images/d4c48df47a490a.jpg"
  b03_alt: "Femme avec des cheveux bruns et une veste noire, souriant, au coucher du soleil en ville."
  b04_1: "Qui sommes-nous ?"
  b05_photo: "/assets/images/52ecb0d3a5f2df.jpg"
  b05_alt: "Une femme posant avec un mascotte de baseball dans un stade. La mascotte porte une casquette bleue et un uniforme blanc avec le mot 'Giants'."
  b07_1: "Jeanne Lethielleux"
  b08_1: "Fondatrice - Experte en gestion de projet et communication"
  b08_2: "Je suis celle qui garde le cap. Organiser, prioriser, anticiper : c'est ce que je fais depuis plusieurs années sur des projets internationaux en France et à l'étranger. "
  b08_3: "Chez Blabla Korea, je suis celle qui structure : de la première prise de contact jusqu'à la concrétisation de votre projet, je m'assure que chaque étape avance. Curieuse et attentive, je suis persuadée que les meilleures opportunités se trouvent quand on accepte de sortir des sentiers battus."
  b10_photo: "/assets/images/8d08d914be6275.jpg"
  b10_alt: "Une personne souriante assise sur un banc le long de la Seine à Paris, avec un drapeau français en arrière-plan, et des ponts, des bateaux et des bâtiments historiques visibles dans la scène."
  b11_1: "Fondateur - Expert Corée et business"
  b11_2: "Je suis celui qui va vers l'autre.  "
  b11_3: "Chez Blabla Korea, je suis celui qui connecte : je sais où chercher, qui contacter, comment formuler les choses pour que les deux côtés se comprennent vraiment. Curieux et déterminé, je crois que c'est dans l'authenticité de chaque échange, sans filtre ni détour, que naissent les meilleures relations."
  b12_1: "Jonghyuk Lee"
  b13_photo: "/assets/images/d7690b7f64b3f7.jpg"
  b13_alt: "Espace intérieur moderne avec sculpture de bust à côté d'un fauteuil en cuir marron, une plante avec des fleurs jaunes, sacs de shopping blancs, un purificateur d'air et des rideaux beige devant une arche."
  b14_photo: "/assets/images/b7496a79531af8.jpg"
  b14_alt: "Une femme avec des cheveux courts, portant un manteau noir, debout près d'une rivière ou d'un port, avec un bâtiment et des statues en arrière-plan."
  b15_1: "Les personnes sans qui ce projet ne serait pas possible…"
  b16_1: "Photographe "
  b16_2: "Parce que ce projet se voulait à notre image, il n'y avait personne de mieux pour l’illustrer que Léo qui nous a accompagnés sur ce beau projet."
  b17_1: "Léo Lethielleux"
  b18_1: "\n    Voir son portfolio\n  "
  b19_photo: "/assets/images/df6b29e8ccaba1.jpg"
  b19_alt: "Une jeune femme avec de longs cheveux bruns, portant un haut noir avec des détails roses, regarde par-dessus son épaule avec un léger sourire."
  b20_photo: "/assets/images/1b6f6d02524265.jpg"
  b20_alt: "Salon de coiffure moderne avec chaises de maquillage marron et miroirs ronds avec éclairage LED dans un intérieur blanc et gris."
  b21_1: "Ambassadrice K-beauty et mode"
  b21_2: "Parce que ce projet gagne à être vécu depuis la Corée, il nous fallait quelqu'un sur place. Depuis Daegu, où elle dirige son salon "
  b21_3: "The Perfume Avenue"
  b21_4: ", Hyanggi est notre reporter sur le terrain. Elle nous accompagne sur les réseaux sociaux et partage ses conseils beauté et mode, ses coups de coeur et les tendances du moment, pour vous faire vivre la Corée en direct."
  b21_5: "Multiple médaillée d'or en concours internationaux de beauté et lauréate du Prix artistique de la Ville de Daegu, elle apporte à Blabla Korea un oeil d'experte et un véritable ancrage local."
  b22_1: "Hyanggi Lee"
  b23_1: "À propos de notre projet"
  b24_1: "Nous avons chacun vécu dans le pays de l'autre. Jonghyuk en France, Jeanne en Corée. Au fil de ces années, nous avons tous les deux touché du doigt la même réalité : la langue bloque, mais la culture isole encore plus. Ne pas savoir à qui s'adresser, comment formuler une demande, quels outils utiliser, quels codes respecter : ce sont notamment ces difficultés là qui poussent certains à abandonner leurs projets."
  b24_2: "C'est de cette expérience commune qu'est né Blabla Korea. Nous nous positionnons comme : une personne ressource à vos côtés, quelle que soit la nature de votre projet avec la Corée. Nous intervenons là où la barrière se dresse."
  b24_3: "Notre force ? Une connaissance intime des deux cultures et une "
  b24_4: "complémentarité "
  b24_5: "qui nous permet de couvrir ensemble ce qu'aucun de nous deux ne pourrait faire seul."
  b24_6: "Notre mot d'ordre, c'est l'"
  b24_7: "échange"
  b24_8: ". Avant toute chose, nous prenons le temps de comprendre votre projet et de vous écouter vraiment. Parce qu'un bon accompagnement commence par une "
  b24_9: "conversation "
  b24_10: "et que chaque projet mérite une "
  b24_11: "réponse sur mesure."
  b25_photo: "/assets/images/b514d03c583279.jpg"
  b25_alt: "Pont suspendu de Pohang sur lequel des gens sont en train de marcher."
  b26_1: "Nous vous accompagnons pour réaliser votre projet avec la Corée"
  b27_1: "Notre expertise"
  b28_1: "Expertise B2B"
  b28_2: "Facilitation France-Corée"
  b28_3: "Un projet avec la Corée ? Parlons-en. "
  b29_1: "\n    Découvrez l'offre B2B\n  "
  b32_1: "Échangeons ensemble sur votre projet"
  b32_2: "Un premier échange, "
  b32_3: "offert "
  b32_4: "et "
  b32_5: "sans engagement"
  b32_6: ", pour comprendre votre projet et voir ensemble comment nous pouvons vous aider. "
